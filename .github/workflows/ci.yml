name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,gis,ml,api,radar]"
      - name: Test
        run: pytest -q -W ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test, build
        run: |
          pnpm -C packages/shared exec tsc --noEmit
          pnpm -C apps/resident typecheck
          pnpm -C apps/resident test
          pnpm -C apps/resident build
          pnpm -C apps/admin typecheck
          pnpm -C apps/admin test
          pnpm -C apps/admin build
