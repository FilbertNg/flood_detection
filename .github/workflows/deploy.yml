name: Deploy API

# After CI passes on main, send the code to the VPS (deploy/vps/README.md). The deploy key can only run
# /opt/floodready/bin/deploy.sh, which restarts the API only when backend files changed and rolls back if it
# does not come back. Run it by hand from the Actions tab to redeploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Skip if main has moved on
        id: latest
        run: |
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; its own run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to the VPS
        if: steps.latest.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar HEAD |
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "floodready@$HOST" "deploy $(git rev-parse --short HEAD)"
