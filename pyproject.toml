[project]
name = "floodready"
version = "0.1.0"
description = "Flood-Ready Township: data pipeline and backend (SDP University Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["floodready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
