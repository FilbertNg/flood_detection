[project]
name = "floodready"
version = "0.1.0"
description = "Flood-Ready Township: data pipeline and backend (SDP University Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gis = ["geopandas>=1.0", "shapely>=2.0", "rasterio>=1.4", "pysheds>=0.5"]
ml = ["scikit-learn>=1.5", "joblib>=1.4"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt>=2.8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floodready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import shared helpers as tests.<module> under plain `pytest` (as CI runs it)
