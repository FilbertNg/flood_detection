# Station rules: the safety floor under the ML trigger (build plan §2; contract).
# Figures are JPS's own: one-hour intensity categories (heavy 31-60 mm, very heavy > 60 mm)
# and "convective rain more than 60 mm in 2 to 4 hours may cause flash floods".
# Starting values; tune per township on 2024+ events.

rain:
  watch:   {rain_1h_min_mm: 31, rain_2to4h_min_mm: 40}    # either one, >=
  warning: {rain_1h_above_mm: 60, rain_2to4h_min_mm: 60}  # 1 h strictly above 60, or 2-4 h >= 60

# River band (the station's own JPS thresholds) -> trigger level
river: {alert: watch, warning: warning, danger: danger}

stale_after_min: 120          # a station with no reading for longer is stale

alerts:
  cooldown_min: 60            # no repeat alert for a street unless its level rises
  alert_levels: [watch, warning, danger]   # issued and stored (in-app)
  push_levels: [watch, warning, danger]   # only these are flagged push: true for a notifier (team decision 17 Oct 2026: push Watch too)
  window_from: warning                    # the "flooding expected" nowcast window is only set from this level up

# Ground-truth sensors (WP4). A reading above threshold_cm confirms alerts on the streets that device speaks for.
# Unknown device ids are rejected. sim-1 is the simulated sensor (scripts/sim_sensor.py); it is placed on a street from the
# residents' memorandum, and its readings only ever confirm labelled replay alerts, never live ones.
sensor:
  threshold_cm: 15
  devices:
    sim-1: {street_ids: [BBR-jalan-makyong-1-ku5]}

# Which stations decide a street (scripts/build_street_stations.py). Radii follow a redundancy rule: the smallest
# rain radius that gives every street at least `min_rain_gauges` gauges, from the spacing of the gauge network
# (BBR's 7 gauges are 2.6-9.2 km from their nearest neighbour; 8 km covers 888/943 streets, 10 km covers all).
# Note: min_rain_gauges already guarantees >= 2 gauges at any radius; the radius decides how many EXTRA gauges a street sees.
# River station: first one on the street's flow path within 15 km, else the nearest within river_radius_km.
street_stations: {rain_radius_km: 10, min_rain_gauges: 2, river_radius_km: 10}

nowcast_window_min: {start: 30, end: 90}   # expected flooding window after issue

outlook:
  forecast_6_24h_min_mm: 40   # forecast rain over the next 6-24 h that triggers an Outlook
